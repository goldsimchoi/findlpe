version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/lpeco"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
